name: SMOKE v9

on:
  push:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Write SMOKE app code
        run: |
          base64 -d > smoke-src.tar.gz <<'SMOKE_EOF'
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          SMOKE_EOF
          tar xzf smoke-src.tar.gz
          rm smoke-src.tar.gz
          find . -type f | sort

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SMOKE.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SMOKE-apk
          path: SMOKE.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: smoke-${{ github.run_id }}
          name: SMOKE build ${{ github.run_number }}
          files: SMOKE.apk
          make_latest: true
