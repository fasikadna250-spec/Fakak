          SMOKE_EOF
          mkdir -p app/src/main/java/com/faxtra/smoke
          cat > app/src/main/java/com/faxtra/smoke/CommandParser.kt <<'SMOKE_EOF'
          package com.faxtra.smoke

          import android.content.Context
          import android.content.Intent

          /** Understands "hey smoke, open whatsapp" and finds the app to launch. */
          object CommandParser {

              // Ways speech recognition may hear "Smoke".
              private val wakeWords = listOf("smoke", "smokey", "smoky", "smokie")

              sealed class Result {
                  object None : Result()
                  object WakeOnly : Result()
                  object Time : Result()
                  data class Open(val appName: String) : Result()
              }

              /**
               * @param requireWake if false (just after "Hey Smoke" alone), an "open X" without the wake word is accepted.
               */
              fun parse(heard: String, requireWake: Boolean): Result {
                  val text = heard.lowercase().replace(",", " ").replace(".", " ").trim()
                  val words = text.split(Regex("\\s+")).filter { it.isNotEmpty() }
                  val wakeIndex = words.indexOfFirst { it in wakeWords }

                  if (requireWake && wakeIndex < 0) return Result.None

                  val afterWake = if (wakeIndex >= 0) words.drop(wakeIndex + 1) else words
                  val openIndex = afterWake.indexOfFirst { it == "open" || it == "launch" || it == "start" }
                  if (openIndex >= 0) {
                      val name = afterWake.drop(openIndex + 1).joinToString(" ").trim()
                      if (name.isNotEmpty()) return Result.Open(name)
                  }
                  if (afterWake.contains("time") && (afterWake.contains("what") || afterWake.contains("what's"))) {
                      return Result.Time
                  }
                  return if (wakeIndex >= 0) Result.WakeOnly else Result.None
              }

              private fun normalize(s: String): String =
                  s.lowercase().filter { it.isLetterOrDigit() }

              /** Returns the package name of the best matching installed app, or null. */
              fun findApp(context: Context, spokenName: String): Pair<String, String>? {
                  val wanted = normalize(spokenName)
                  if (wanted.isEmpty()) return null

                  val pm = context.packageManager
                  val launcher = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(launcher, 0).map { info ->
                      val label = info.loadLabel(pm).toString()
                      Triple(normalize(label), label, info.activityInfo.packageName)
                  }

                  apps.firstOrNull { it.first == wanted }?.let { return it.third to it.second }
                  apps.filter { it.first.startsWith(wanted) }.minByOrNull { it.first.length }
                      ?.let { return it.third to it.second }
                  apps.filter { it.first.contains(wanted) }.minByOrNull { it.first.length }
                      ?.let { return it.third to it.second }
                  apps.filter { it.first.length >= 3 && wanted.contains(it.first) }.maxByOrNull { it.first.length }
                      ?.let { return it.third to it.second }
                  return null
              }
          }
          SMOKE_EOF
          mkdir -p app/src/main/java/com/faxtra/smoke
          cat > app/src/main/java/com/faxtra/smoke/HudView.kt <<'SMOKE_EOF'
          package com.faxtra.smoke

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.os.SystemClock
          import android.view.View
          import kotlin.math.cos
          import kotlin.math.min
          import kotlin.math.sin

          /** Animated holographic rings. Spins fast and pulses while SMOKE is listening. */
          class HudView(context: Context) : View(context) {

              var active = false
              var accent = Color.rgb(255, 106, 26)
              var accent2 = Color.rgb(242, 184, 48)
              /** false = leave the middle empty for the logo. */
              var showCore = true

              private val stroke = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
              }
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val oval = RectF()
              private val startTime = SystemClock.uptimeMillis()
              private var spin = 0f
              private var lastFrame = SystemClock.uptimeMillis()

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val size = MeasureSpec.getSize(widthMeasureSpec)
                  setMeasuredDimension(size, size)
              }

              private fun arcs(c: Canvas, cx: Float, cy: Float, radius: Float, width: Float, rotation: Float,
                               segments: List<Pair<Float, Float>>, alpha: Int) {
                  stroke.color = accent
                  stroke.alpha = alpha
                  stroke.strokeWidth = width
                  oval.set(cx - radius, cy - radius, cx + radius, cy + radius)
                  for ((startAngle, sweep) in segments) {
                      c.drawArc(oval, startAngle + rotation, sweep, false, stroke)
                  }
              }

              override fun onDraw(c: Canvas) {
                  val now = SystemClock.uptimeMillis()
                  val dt = (now - lastFrame) / 1000f
                  lastFrame = now
                  spin += dt * (if (active) 1f else 0.2f)
                  val t = (now - startTime) / 1000f

                  val cx = width / 2f
                  val cy = height / 2f
                  val r = min(cx, cy) * 0.92f

                  // Outer tick ring
                  stroke.color = accent
                  stroke.strokeWidth = r * 0.008f
                  for (i in 0 until 72) {
                      val a = Math.toRadians((i * 5.0) + spin * 6.0)
                      val inner = r * (if (i % 6 == 0) 0.90f else 0.94f)
                      stroke.alpha = if (i % 6 == 0) 200 else 90
                      c.drawLine(
                          cx + (cos(a) * inner).toFloat(), cy + (sin(a) * inner).toFloat(),
                          cx + (cos(a) * r).toFloat(), cy + (sin(a) * r).toFloat(), stroke
                      )
                  }

                  arcs(c, cx, cy, r * 0.82f, r * 0.035f, spin * 40f,
                      listOf(0f to 70f, 110f to 35f, 170f to 120f, 310f to 25f), 230)
                  val keep = accent
                  accent = accent2
                  arcs(c, cx, cy, r * 0.75f, r * 0.012f, -spin * 65f,
                      listOf(20f to 140f, 200f to 90f, 300f to 30f), 190)
                  accent = keep

                  if (!showCore) {
                      // Pulsing ember halo hugging the logo
                      val glowAlpha = if (active) (120 + 100 * sin(t * 5f)).toInt().coerceIn(20, 230) else 70
                      stroke.color = accent
                      stroke.alpha = glowAlpha
                      stroke.strokeWidth = r * 0.02f
                      c.drawCircle(cx, cy, r * 0.69f, stroke)
                      postInvalidateOnAnimation()
                      return
                  }

                  arcs(c, cx, cy, r * 0.58f, r * 0.06f, spin * 25f,
                      (0 until 8).map { (it * 45f) to 30f }, 120)
                  arcs(c, cx, cy, r * 0.47f, r * 0.012f, -spin * 90f,
                      listOf(0f to 300f), 200)

                  // Glowing core
                  val pulse = if (active) 0.88f + 0.12f * sin(t * 5f) else 0.82f
                  val coreR = r * 0.40f * pulse
                  fill.shader = RadialGradient(
                      cx, cy, coreR,
                      intArrayOf(Color.argb(255, 210, 252, 255), Color.argb(170, Color.red(accent), Color.green(accent), Color.blue(accent)), Color.argb(0, 0, 0, 0)),
                      floatArrayOf(0f, 0.38f, 1f),
                      Shader.TileMode.CLAMP
                  )
                  c.drawCircle(cx, cy, coreR, fill)
                  stroke.alpha = 255
                  stroke.strokeWidth = r * 0.014f
                  c.drawCircle(cx, cy, r * 0.30f, stroke)

                  postInvalidateOnAnimation()
              }
          }
          SMOKE_EOF
          mkdir -p app/src/main/java/com/faxtra/smoke
          cat > app/src/main/java/com/faxtra/smoke/MainActivity.kt <<'SMOKE_EOF'
          package com.faxtra.smoke

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.speech.SpeechRecognizer
          import android.view.Gravity
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {

              private val cyan = Color.rgb(255, 122, 40)      // ember orange (main accent)
              private val gold = Color.rgb(242, 184, 48)
              private val dimCyan = Color.rgb(170, 120, 90)   // dim warm grey
              private val bg = Color.rgb(5, 5, 5)

              private lateinit var hud: HudView
              private lateinit var status: TextView
              private lateinit var heardLine: TextView
              private lateinit var replyLine: TextView
              private lateinit var mainButton: TextView
              private val ui = Handler(Looper.getMainLooper())
              private var density = 1f

              private val ticker = object : Runnable {
                  override fun run() {
                      refresh()
                      ui.postDelayed(this, 400)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = bg
                  window.navigationBarColor = bg
                  density = resources.displayMetrics.density
                  val pad = dp(24)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(pad, dp(32), pad, pad)
                      setBackgroundColor(bg)
                  }

                  root.addView(mono("FA XTRA SYSTEMS", 12f, dimCyan).apply { letterSpacing = 0.4f })
                  root.addView(mono("S.M.O.K.E.", 34f, gold, bold = true).apply {
                      typeface = Typeface.create("sans-serif-condensed", Typeface.BOLD)
                      letterSpacing = 0.25f
                      setShadowLayer(22f, 0f, 0f, cyan)
                      setPadding(0, dp(4), 0, dp(12))
                  })

                  val core = FrameLayout(this).apply {
                      isClickable = true
                      contentDescription = "SMOKE core. Tap to turn listening on or off."
                      setOnClickListener { toggle() }
                  }
                  core.addView(ImageView(this).apply {
                      setImageResource(R.drawable.smoke_logo)
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      importantForAccessibility = android.view.View.IMPORTANT_FOR_ACCESSIBILITY_NO
                  }, FrameLayout.LayoutParams(dp(204), dp(204), Gravity.CENTER))
                  hud = HudView(this).apply { showCore = false }
                  core.addView(hud, FrameLayout.LayoutParams(dp(320), dp(320), Gravity.CENTER))
                  root.addView(core, LinearLayout.LayoutParams(dp(320), dp(320)))

                  status = mono("", 15f, cyan, bold = true).apply {
                      letterSpacing = 0.15f
                      setPadding(0, dp(16), 0, dp(12))
                  }
                  root.addView(status)

                  val readout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(12), dp(16), dp(12))
                      background = GradientDrawable().apply {
                          setColor(Color.argb(36, 255, 122, 40))
                          setStroke(dp(1), Color.argb(120, 255, 122, 40))
                          cornerRadius = dp(10).toFloat()
                      }
                  }
                  heardLine = mono("", 14f, Color.rgb(240, 225, 210))
                  replyLine = mono("", 14f, gold).apply { setPadding(0, dp(6), 0, 0) }
                  readout.addView(heardLine)
                  readout.addView(replyLine)
                  root.addView(readout, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))

                  mainButton = mono("", 17f, bg, bold = true).apply {
                      gravity = Gravity.CENTER
                      letterSpacing = 0.2f
                      minHeight = dp(56)
                      isClickable = true
                      isFocusable = true
                      setOnClickListener { toggle() }
                  }
                  root.addView(mainButton, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(56)).apply {
                      topMargin = dp(20)
                  })

                  root.addView(mono(
                      "COMMANDS\n" +
                          "› \"Hey Smoke, open WhatsApp\"  (any app)\n" +
                          "› \"Hey Smoke\" … \"open YouTube\"\n" +
                          "› \"Hey Smoke, what time is it\"\n\n" +
                          "SETUP: allow microphone + notifications, then turn ON \"Display over other apps\" for SMOKE. Keep the phone unlocked.",
                      12f, dimCyan
                  ).apply { setPadding(0, dp(20), 0, 0); setLineSpacing(0f, 1.3f) })

                  setContentView(ScrollView(this).apply {
                      setBackgroundColor(bg)
                      addView(root)
                  })
              }

              private fun dp(v: Int) = (v * density).toInt()

              private fun mono(text: String, size: Float, color: Int, bold: Boolean = false) = TextView(this).apply {
                  this.text = text
                  textSize = size
                  setTextColor(color)
                  typeface = Typeface.create(Typeface.MONOSPACE, if (bold) Typeface.BOLD else Typeface.NORMAL)
                  gravity = Gravity.CENTER_HORIZONTAL
              }

              override fun onResume() {
                  super.onResume()
                  ui.post(ticker)
              }

              override fun onPause() {
                  ui.removeCallbacks(ticker)
                  super.onPause()
              }

              private fun refresh() {
                  val on = SmokeService.isRunning
                  hud.active = on
                  status.text = when {
                      on -> "● ONLINE — LISTENING"
                      !hasMic() -> "○ STANDBY — MIC ACCESS NEEDED"
                      !Settings.canDrawOverlays(this) -> "○ STANDBY — OVERLAY ACCESS NEEDED"
                      else -> "○ STANDBY"
                  }
                  status.setTextColor(if (on) cyan else dimCyan)
                  heardLine.text = "> HEARD:  " + (SmokeService.lastHeard.ifEmpty { "—" })
                  replyLine.text = "< SMOKE:  " + (SmokeService.lastReply.ifEmpty { "Awaiting command" })
                  mainButton.text = if (on) "SHUT DOWN" else "ACTIVATE"
                  mainButton.setTextColor(if (on) cyan else bg)
                  mainButton.background = GradientDrawable().apply {
                      cornerRadius = dp(28).toFloat()
                      if (on) {
                          setColor(Color.TRANSPARENT)
                          setStroke(dp(2), cyan)
                      } else {
                          setColor(cyan)
                      }
                  }
              }

              private fun hasMic() =
                  checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED

              private fun toggle() {
                  if (SmokeService.isRunning) {
                      startService(Intent(this, SmokeService::class.java).setAction(SmokeService.ACTION_STOP))
                  } else {
                      startFlow()
                  }
                  ui.postDelayed({ refresh() }, 300)
              }

              private fun startFlow() {
                  if (!hasMic()) {
                      val perms = mutableListOf(Manifest.permission.RECORD_AUDIO)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          perms.add(Manifest.permission.POST_NOTIFICATIONS)
                      }
                      requestPermissions(perms.toTypedArray(), 1)
                      return
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      SmokeService.lastReply = "Turn on \"Display over other apps\", then tap ACTIVATE."
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      SmokeService.lastReply = "Speech recognition unavailable. Enable the Google app."
                      return
                  }
                  startForegroundService(Intent(this, SmokeService::class.java))
              }

              @Deprecated("Deprecated in Java")
              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (hasMic()) startFlow()
                  else SmokeService.lastReply = "I need the microphone to hear you."
              }
          }
          SMOKE_EOF
          mkdir -p app/src/main/java/com/faxtra/smoke
          cat > app/src/main/java/com/faxtra/smoke/SmokeService.kt <<'SMOKE_EOF'
          package com.faxtra.smoke

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import java.util.Locale

          /** Keeps listening for "Hey Smoke, open ..." while SMOKE is switched on. */
          class SmokeService : Service(), RecognitionListener {

              companion object {
                  const val ACTION_STOP = "com.faxtra.smoke.STOP"
                  private const val CHANNEL_ID = "smoke_listening"
                  private const val NOTIFICATION_ID = 7
                  private const val FOLLOW_UP_WINDOW_MS = 8000L
                  @Volatile var isRunning = false
                  @Volatile var lastHeard = ""
                  @Volatile var lastReply = ""
              }

              private val handler = Handler(Looper.getMainLooper())
              private var recognizer: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var listening = false
              private var awaitingCommandUntil = 0L

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  tts = TextToSpeech(this) { status ->
                      ttsReady = status == TextToSpeech.SUCCESS
                      if (ttsReady) {
                          val british = tts?.isLanguageAvailable(Locale.UK) ?: TextToSpeech.LANG_NOT_SUPPORTED
                          tts?.language = if (british >= TextToSpeech.LANG_AVAILABLE) Locale.UK else Locale.US
                          tts?.setPitch(0.85f)
                          tts?.setSpeechRate(1.0f)
                          if (isRunning) speak("SMOKE online. Ready when you are, boss.")
                      }
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      shutDown()
                      return START_NOT_STICKY
                  }
                  goForeground()
                  if (!isRunning) {
                      isRunning = true
                      startListening()
                  }
                  return START_STICKY
              }

              private fun goForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL_ID, "SMOKE listening", NotificationManager.IMPORTANCE_LOW)
                  )
                  val stopIntent = PendingIntent.getService(
                      this, 1,
                      Intent(this, SmokeService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val openIntent = PendingIntent.getActivity(
                      this, 2,
                      Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  @Suppress("DEPRECATION")
                  val notification = Notification.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentTitle("SMOKE is listening")
                      .setContentText("Say \"Hey Smoke, open WhatsApp\"")
                      .setOngoing(true)
                      .setContentIntent(openIntent)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Stop", stopIntent)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(NOTIFICATION_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(NOTIFICATION_ID, notification)
                  }
              }

              private fun startListening() {
                  if (!isRunning) return
                  try {
                      recognizer?.destroy()
                      recognizer = SpeechRecognizer.createSpeechRecognizer(this).also {
                          it.setRecognitionListener(this)
                      }
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.US.toLanguageTag())
                          putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5)
                          putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, false)
                          putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, packageName)
                      }
                      listening = true
                      recognizer?.startListening(intent)
                  } catch (e: Exception) {
                      listening = false
                      restartLater(2000)
                  }
              }

              private fun restartLater(delayMs: Long) {
                  handler.removeCallbacksAndMessages(null)
                  handler.postDelayed({ startListening() }, delayMs)
              }

              private fun handle(heardOptions: List<String>) {
                  val followUp = SystemClock.elapsedRealtime() < awaitingCommandUntil
                  for (heard in heardOptions) {
                      when (val result = CommandParser.parse(heard, requireWake = !followUp)) {
                          is CommandParser.Result.Open -> {
                              lastHeard = heard
                              awaitingCommandUntil = 0L
                              openApp(result.appName)
                              return
                          }
                          is CommandParser.Result.Time -> {
                              lastHeard = heard
                              awaitingCommandUntil = 0L
                              val now = java.text.SimpleDateFormat("h:mm a", Locale.US).format(java.util.Date())
                              speak("It's $now, boss.")
                              restartLater(2000)
                              return
                          }
                          is CommandParser.Result.WakeOnly -> {
                              lastHeard = heard
                              awaitingCommandUntil = SystemClock.elapsedRealtime() + FOLLOW_UP_WINDOW_MS
                              speak("Yes, boss?")
                              restartLater(1100)
                              return
                          }
                          CommandParser.Result.None -> Unit
                      }
                  }
                  restartLater(250)
              }

              private fun openApp(spokenName: String) {
                  val match = CommandParser.findApp(this, spokenName)
                  if (match == null) {
                      speak("Sorry boss, I can't find $spokenName.")
                      restartLater(2000)
                      return
                  }
                  val (pkg, label) = match
                  val launch = packageManager.getLaunchIntentForPackage(pkg)
                  if (launch == null) {
                      speak("I can't open $label")
                      restartLater(2000)
                      return
                  }
                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED)
                  try {
                      startActivity(launch)
                      speak("Opening $label.")
                  } catch (e: Exception) {
                      speak("Android blocked opening $label. Check display over other apps.")
                  }
                  restartLater(2000)
              }

              private fun speak(text: String) {
                  lastReply = text
                  if (ttsReady) tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "smoke")
              }

              private fun shutDown() {
                  isRunning = false
                  lastReply = "Shutting down."
                  listening = false
                  handler.removeCallbacksAndMessages(null)
                  recognizer?.destroy()
                  recognizer = null
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              override fun onDestroy() {
                  isRunning = false
                  handler.removeCallbacksAndMessages(null)
                  recognizer?.destroy()
                  recognizer = null
                  tts?.shutdown()
                  tts = null
                  super.onDestroy()
              }

              // --- RecognitionListener ---
              override fun onResults(results: Bundle?) {
                  listening = false
                  val heard = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION).orEmpty()
                  if (heard.isEmpty()) restartLater(250) else handle(heard)
              }

              override fun onError(error: Int) {
                  listening = false
                  val delay = when (error) {
                      SpeechRecognizer.ERROR_RECOGNIZER_BUSY -> 1500L
                      SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS -> 10000L
                      SpeechRecognizer.ERROR_NETWORK, SpeechRecognizer.ERROR_NETWORK_TIMEOUT, SpeechRecognizer.ERROR_SERVER -> 3000L
                      else -> 300L
                  }
                  restartLater(delay)
              }

              override fun onReadyForSpeech(params: Bundle?) = Unit
              override fun onBeginningOfSpeech() = Unit
              override fun onRmsChanged(rmsdB: Float) = Unit
              override fun onBufferReceived(buffer: ByteArray?) = Unit
              override fun onEndOfSpeech() = Unit
              override fun onPartialResults(partialResults: Bundle?) = Unit
              override fun onEvent(eventType: Int, params: Bundle?) = Unit
          }
